# ===== KITTY CONFIGURATION =====
# kaze's Kitty Config

# ===== CURSOR SETTINGS =====
# Animated cursor trail (like HyDE project)
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Cursor shape (block, beam, underline)
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# ===== TRANSPARENCY & BACKGROUND =====
background_opacity 0.6
dynamic_background_opacity yes
background_blur 15

# ===== FONT SETTINGS =====
font_family      MesloLGS Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

adjust_line_height 0
adjust_column_width 0

# ===== COLORS =====
foreground #2c3e50
background #f5f8fb
selection_foreground #e8f0f8
selection_background #5a9ec4

# Cursor colors
cursor #a8d8ea
cursor_text_color #1a2332

# URL underline color
url_color #5b9bd5

# Terminal colors (16 color palette)
color0  #e8eef3
color1  #c0646e
color2  #000000
color3  #b08a4e
color4  #4a8fb8
color5  #8e7cc3
color6  #5ba4b5
color7  #3a4f5c
color8  #c8d6e0
color9  #d4788a
color10 #000000
color11 #c4a462
color12 #6aafcf
color13 #a898d8
color14 #78bdd0
color15 #1e2d38

# ===== WINDOW SETTINGS =====
window_padding_width 8
hide_window_decorations titlebar-only
remember_window_size yes
initial_window_width 1200
initial_window_height 700

# ===== TABS =====
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Active tab colors
active_tab_foreground   #ffffff
active_tab_background   #6aafcf
active_tab_font_style   bold

# Inactive tab colors
inactive_tab_foreground #5a7a8c
inactive_tab_background #e4eef4
inactive_tab_font_style normal

# ===== PERFORMANCE =====
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ===== BELL =====
enable_audio_bell no
visual_bell_duration 0.0

# ===== MOUSE =====
mouse_map left click ungrabbed mouse_handle_click selection link prompt
url_style curly
detect_urls yes
copy_on_select yes

# ===== SCROLLBACK =====
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ===== ADVANCED =====
shell_integration enabled
allow_remote_control yes
listen_on unix:/tmp/kitty
update_check_interval 0
confirm_os_window_close 1

# ===== KEYBOARD SHORTCUTS =====
map cmd+shift+r load_config_file
map cmd+shift+equal change_font_size all +1.0
map cmd+shift+minus change_font_size all -1.0
map cmd+shift+0 change_font_size all 0
map cmd+t new_tab
map cmd+n new_os_window
map cmd+w close_window
map cmd+shift+[ previous_tab
map cmd+shift+] next_tab
map cmd+d launch --location=hsplit
map cmd+shift+d launch --location=vsplit
map cmd+[ neighboring_window left
map cmd+] neighboring_window right
map cmd+shift+up neighboring_window up
map cmd+shift+down neighboring_window down
map cmd+shift+z toggle_layout stack

# ===== NOTES =====
# To change opacity on the fly: Cmd+Shift+a then type opacity value (0.0-1.0)
# To see all colors: kitty +kitten themes
# To reload config: Cmd+Shift+r